name: Linux
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test bounded memory reads on Linux
        run: |
          cc -std=gnu11 -Wall -Wextra -Werror -ISources/MachOObjCSectionC/include Sources/MachOObjCSectionC/memory_probe.c Tests/MemoryProbeC/smoke.c -o /tmp/memory-probe-test
          /tmp/memory-probe-test
      - name: Build the reader with Swift 6.3.3
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/workspace" -w /workspace swift:6.3.3-jammy@sha256:0c9411e2f70154a16f3e5660299d618a3642a445b446efe2aa637a4d01a83d54 swift build --target MachOObjCSection
