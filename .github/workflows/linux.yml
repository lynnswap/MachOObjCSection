name: Linux memory probe
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test bounded memory reads on Linux
        run: |
          cc -std=gnu11 -Wall -Wextra -Werror -ISources/MachOObjCSectionC/include Sources/MachOObjCSectionC/memory_probe.c Tests/MemoryProbeC/smoke.c -o /tmp/memory-probe-test
          /tmp/memory-probe-test
