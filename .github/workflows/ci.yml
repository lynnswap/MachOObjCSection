name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - README.md
      - LICENSE
      - 'Documentations/**'
      - 'Changelogs/**'
  pull_request:
    paths-ignore:
      - README.md
      - LICENSE
      - 'Documentations/**'
      - 'Changelogs/**'
  workflow_dispatch:

permissions:
  contents: read

# No Linux job, unlike upstream's CI: this fork does not build on Linux.
# FoundationToolbox, reached through swift-objc-dump, imports Security
# unconditionally.
jobs:
  build:
    name: Build & Test
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        # MachOObjCSectionTests loads a sample binary from a maintainer-local
        # path in setUp() and fails on any other machine.
        run: swift test --skip MachOObjCSectionTests
